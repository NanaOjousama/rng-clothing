# Phase-5 pilot arm A: rank 16 + text encoders.  Fresh from SDXL Base 1.0 (path given on the command line).
# Shared with B/C: 768 px, batch 4, bf16, AdamW8bit, constant_with_warmup (a 4-epoch pilot must not decay to 0,
# or the arms are compared at an artificial end state), checkpoint every epoch, min-SNR 5, same seed and data.
dataset_config = '/workspace/phase5/configs/dataset_phase5.toml'
output_dir = '/workspace/phase5/runs/pilot_A'
output_name = 'sdvhat_p5_pilot_A'
logging_dir = '/workspace/phase5/runs/pilot_A/logs'
log_with = 'tensorboard'

network_module = 'networks.lora'
network_dim = 16
network_alpha = 8
unet_lr = 1e-4
text_encoder_lr = [2.5e-5]

optimizer_type = 'AdamW8bit'
lr_scheduler = 'constant_with_warmup'
lr_warmup_steps = 0.05
max_train_epochs = 4
save_every_n_epochs = 1
min_snr_gamma = 5
seed = 20261018

mixed_precision = 'bf16'
save_precision = 'bf16'
sdpa = true
no_half_vae = true
gradient_checkpointing = true
cache_latents = true
cache_latents_to_disk = true
max_data_loader_n_workers = 2
persistent_data_loader_workers = true
save_model_as = 'safetensors'
