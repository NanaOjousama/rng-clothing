# Phase-5 pilot-2 arm C3: rank 64 / alpha 32 (same 2:1 ratio as C), frozen TE, cached TE outputs,
# 10 epochs. Isolates whether rank-32 capacity was the "rough"/blobby-shape bottleneck across 26
# families sharing one LoRA, independent of the epoch increase tested by C2.
dataset_config = '/workspace/phase5/configs/dataset_phase5.toml'
output_dir = '/workspace/phase5/runs/pilot2_C3'
output_name = 'sdvhat_p5_pilot2_C3'
logging_dir = '/workspace/phase5/runs/pilot2_C3/logs'
log_with = 'tensorboard'

network_module = 'networks.lora'
network_dim = 64
network_alpha = 32
unet_lr = 1e-4
network_train_unet_only = true
cache_text_encoder_outputs = true
cache_text_encoder_outputs_to_disk = true

optimizer_type = 'AdamW8bit'
lr_scheduler = 'constant_with_warmup'
lr_warmup_steps = 0.05
max_train_epochs = 10
save_every_n_epochs = 2
min_snr_gamma = 5
seed = 20261018

mixed_precision = 'bf16'
save_precision = 'bf16'
sdpa = true
no_half_vae = true
gradient_checkpointing = true
cache_latents = true
cache_latents_to_disk = true
max_data_loader_n_workers = 2
persistent_data_loader_workers = true
save_model_as = 'safetensors'
