# Phase-5 arm D_balance: identical recipe to C2 (rank 32/alpha 16, frozen TE, cached TE outputs) except
# the dataset upweights four-view 2x relative to front (see dataset_phase5_D_balance.toml) and epochs are
# cut from 10 to 7 to hold total optimizer steps roughly level with C2's 2280 (912 imgs/batch4=228 steps/ep
# x10 = 2280; this dataset's 1368 effective imgs/batch4=342 steps/ep x7 = 2394, +5%).
# Goal: keep C2's improved front-layout detail while recovering arm C's clean four-view structure.
dataset_config = '/workspace/phase5/configs/dataset_phase5_D_balance.toml'
output_dir = '/workspace/phase5/runs/pilot3_D_balance'
output_name = 'sdvhat_p5_pilot3_D_balance'
logging_dir = '/workspace/phase5/runs/pilot3_D_balance/logs'
log_with = 'tensorboard'

network_module = 'networks.lora'
network_dim = 32
network_alpha = 16
unet_lr = 1e-4
network_train_unet_only = true
cache_text_encoder_outputs = true
cache_text_encoder_outputs_to_disk = true

optimizer_type = 'AdamW8bit'
lr_scheduler = 'constant_with_warmup'
lr_warmup_steps = 0.05
max_train_epochs = 7
save_every_n_epochs = 1
min_snr_gamma = 5
seed = 20261018

mixed_precision = 'bf16'
save_precision = 'bf16'
sdpa = true
no_half_vae = true
gradient_checkpointing = true
cache_latents = true
cache_latents_to_disk = true
max_data_loader_n_workers = 2
persistent_data_loader_workers = true
save_model_as = 'safetensors'
