# Phase-5 arm D_balance_3x: same recipe as D_balance (rank 32/alpha 16, frozen TE, cached TE outputs)
# except fourview is upweighted 3x instead of 2x (see dataset_phase5_D_balance_3x.toml). Epochs cut
# from 7 to 5 to hold total optimizer steps roughly comparable to D_balance's 2394
# (456 front + 1368 fourview(3x) = 1824 effective imgs/batch4 = 456 steps/ep x5 = 2280, -4.8% vs D_balance).
# Goal: test whether a stronger fourview upweight recovers more of arm C's four-view cleanliness
# (beret, tricorn, cowboy hat, bucket hat, headscarves, animal hat all still showed partial noise/off-hue
# backgrounds at 2x) without degrading front quality below C2/D_balance's level.
dataset_config = '/workspace/phase5/configs/dataset_phase5_D_balance_3x.toml'
output_dir = '/workspace/phase5/runs/pilot4_D_balance_3x'
output_name = 'sdvhat_p5_pilot4_D_balance_3x'
logging_dir = '/workspace/phase5/runs/pilot4_D_balance_3x/logs'
log_with = 'tensorboard'

network_module = 'networks.lora'
network_dim = 32
network_alpha = 16
unet_lr = 1e-4
network_train_unet_only = true
cache_text_encoder_outputs = true
cache_text_encoder_outputs_to_disk = true

optimizer_type = 'AdamW8bit'
lr_scheduler = 'constant_with_warmup'
lr_warmup_steps = 0.05
max_train_epochs = 5
save_every_n_epochs = 1
min_snr_gamma = 5
seed = 20261018

mixed_precision = 'bf16'
save_precision = 'bf16'
sdpa = true
no_half_vae = true
gradient_checkpointing = true
cache_latents = true
cache_latents_to_disk = true
max_data_loader_n_workers = 2
persistent_data_loader_workers = true
save_model_as = 'safetensors'
