# kohya sd-scripts sdxl_train_network.py config, phase 1.  NOT RUN - needs user approval.
# Starts from the official base model every time (never from an older LoRA).
pretrained_model_name_or_path = 'C:\Users\Chris\stardew-lora-lab\models\sdxl\sd_xl_base_1.0.safetensors'
dataset_config = 'C:\Users\Chris\sdxl_lora_research\configs\phase1_front_dataset.toml'
output_dir = 'C:\Users\Chris\sdxl_lora_research\runs\phase1_front'
output_name = "sdvhat_phase1_front"
logging_dir = 'C:\Users\Chris\sdxl_lora_research\runs\phase1_front\logs'

network_module = "networks.lora"
network_dim = 16
network_alpha = 8
network_train_unet_only = true          # text encoders frozen; outputs cached

optimizer_type = "AdamW8bit"            # fall back to Adafactor if bitsandbytes fails on Windows (memory probe decides)
learning_rate = 1e-4
lr_scheduler = "constant_with_warmup"
lr_warmup_steps = 100
max_train_epochs = 12
save_every_n_epochs = 1
min_snr_gamma = 5
seed = 20261011

mixed_precision = "bf16"
save_precision = "bf16"
gradient_checkpointing = true
cache_latents = true
cache_latents_to_disk = true
cache_text_encoder_outputs = true
cache_text_encoder_outputs_to_disk = true
sdpa = true
max_data_loader_n_workers = 0
save_model_as = "safetensors"

sample_every_n_epochs = 1
sample_prompts = 'C:\Users\Chris\sdxl_lora_research\configs\phase1_samples.txt'
sample_sampler = "euler_a"
